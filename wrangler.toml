# Cloudflare Worker 配置：弹幕留言板后端
# 部署：在本目录执行  npx wrangler deploy

name = "cupcake-danmaku"
main = "worker.js"
compatibility_date = "2024-11-01"

# Durable Object 绑定（弹幕房间单例）
[[durable_objects.bindings]]
name = "DANMAKU_ROOM"
class_name = "DanmakuRoom"

# 首次部署需要这条迁移，声明使用 SQLite 存储后端
# （Workers 免费计划只支持 SQLite 后端的 Durable Object）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DanmakuRoom"]
